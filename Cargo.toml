[package]
authors = ["nhatvu148"]
categories = ["multimedia::audio", "multimedia::video"]
description = "High-performance video transcription MCP server using whisper.cpp for faster transcription"
edition = "2024"
keywords = ["whisper", "transcription", "mcp", "video", "audio"]
license = "MIT"
name = "video-transcriber-mcp"
repository = "https://github.com/nhatvu148/video-transcriber-mcp-rs"
version = "0.9.0"

# Keep the JWT test keys out of the published crate. They are throwaway
# fixtures with no access to anything, but crates.io is public and permanent,
# and files named `*-private.pem` sitting in a published package trip secret
# scanners and alarm anyone auditing their dependency tree. `jwt_verify.rs`
# goes with them since it can't run without its fixtures — both stay in git,
# where the tests are actually run from.
exclude = []

[[bin]]
name = "video-transcriber-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-process = "2.5"
axum = {version = "0.8.9", features = ["multipart"]}
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
home = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }

rmcp = {version = "3.1", features = ["server", "transport-io", "transport-streamable-http-server"]}
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tokio = {version = "1.53", features = ["full"]}

#
# The `aws_lc_rs` feature is REQUIRED, not optional tuning. jsonwebtoken 11 made
# the crypto backend pluggable and its default features select *neither*
# provider, so a bare `jsonwebtoken = "11"` compiles and links fine, parses
# headers fine, and rejects malformed tokens fine — then panics the moment it
# verifies a real signature:
#
#   Could not automatically determine the process-level CryptoProvider
#   from jsonwebtoken crate features.
#
# aws-lc-rs (rather than `rust_crypto`) because reqwest already pulls it in:
# its `rustls` feature resolves to `__rustls-aws-lc-rs`, which turns on
# rustls's aws-lc-rs backend. So this adds no new dependency and no new build
# step, whereas `rust_crypto` would pull in 7 more crates including `rsa`.
# Verify with: cargo tree -e features -i rustls
#
# Note this binary links *both* rustls backends — aws-lc-rs via reqwest as
# above, and ring via sqlx's `tls-rustls-ring` below. That ambiguity is exactly
# why jsonwebtoken can't pick a provider on its own and why the feature has to
# be explicit here. Covered by tests/jwt_verify.rs — do not drop it.

tower = "0.5.3"
# map-response-body bridges rmcp's BoxBody responses to axum's Body,
# which the x402 layer and Router::fallback_service both require.
tower-http = {version = "0.7", features = ["cors", "trace", "map-response-body"]}
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
walkdir = "2.5"

# Metal GPU acceleration on macOS (Apple Silicon). On other platforms we fall
# back to plain CPU — change features there if you have CUDA / OpenBLAS / etc.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = {version = "0.16", features = ["metal"]}

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16"

[dev-dependencies]
criterion = "0.8"
# Integration tests in `tests/` can't see the crate's regular dependencies, so
# the HTTP-transport e2e suite needs its own client + runtime. Same versions
# and features as above, so cargo reuses the already-built artifacts.
tokio = {version = "1.53", features = ["full"]}

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[profile.dev]
opt-level = 0
