[package]
authors = ["nhatvu148"]
categories = ["multimedia::audio", "multimedia::video"]
description = "High-performance video transcription MCP server using whisper.cpp for faster transcription"
edition = "2024"
keywords = ["whisper", "transcription", "mcp", "video", "audio"]
license = "MIT"
name = "video-transcriber-mcp"
repository = "https://github.com/nhatvu148/video-transcriber-mcp-rs"
# 0.10 rather than 0.9.1: the library's public surface shrank. `api`, `auth`,
# `credits`, `llm` and `x402_mcp` were public modules and are gone — they were
# product, not protocol, and now live in a private crate that depends on this
# one. Breaking for any library consumer, so it gets a minor bump under
# pre-1.0 semver rather than a patch.
version = "0.10.0"

[[bin]]
name = "video-transcriber-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
# yt-dlp and ffmpeg are driven as subprocesses (transcriber/audio.rs, downloader.rs).
async-process = "2.5"
# The HTTP transport's router. `axum::serve` in main.rs.
axum = "0.8.9"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
home = "0.5"
# `multipart` is for uploading audio to a remote Whisper endpoint
# (transcriber/whisper.rs), not for serving uploads.
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
rmcp = { version = "3.1", features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
# `cors` only. An HTTP MCP endpoint is commonly called from a browser client.
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Metal GPU acceleration on macOS (Apple Silicon). On other platforms we fall
# back to plain CPU — change features there if you have CUDA / OpenBLAS / etc.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16"

[dev-dependencies]
# Integration tests in `tests/` can't see the crate's regular dependencies, so
# the HTTP-transport e2e suite needs its own client + runtime. Same versions
# and features as above, so cargo reuses the already-built artifacts.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.53", features = ["full"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[profile.dev]
opt-level = 0
