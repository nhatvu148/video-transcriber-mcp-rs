name: CI

# release.yml only fires on `v*` tags, so before this workflow existed nothing
# validated a pull request. Everything here runs without secrets or paid
# services: the MCP suites drive the real binary over stdio and HTTP.
#
# The Postgres service and the credit-ledger assertion that used to live here
# went with the code — the ledger, auth and payments moved to a private crate
# and this repo has no database access left to test.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # whisper.cpp is a C++ build; caching it is the difference between a
      # ~2 minute run and a ~10 minute one.
      - name: Cache cargo + build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets


  check:
    # Linux is covered by the `test` job. This catches platform-specific
    # breakage (the whisper-rs metal path on macOS, MSVC on Windows) on a PR
    # rather than after a release tag is already pushed.
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + build artifacts
        uses: Swatinem/rust-cache@v2

      # `check` rather than `build`: it catches the type and platform errors
      # we care about without paying for codegen on three OSes.
      - name: Check
        run: cargo check --all-targets
